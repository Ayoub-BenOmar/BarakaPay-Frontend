<div class="login-page">
  <div class="login-card">
    <!-- Left Panel - Hidden with new design -->
    <div class="login-card__left"></div>

    <!-- Right Panel - Form -->
    <div class="login-card__right">
      <div class="brand">
        <h1 class="brand-title">BarakaPay</h1>
        <p class="brand-subtitle">Votre banque digitale</p>
      </div>

      <div class="login-header">
        <h1>Connexion</h1>
        <p>Accédez à votre espace sécurisé</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="votreemail@exemple.com" />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" formControlName="password" placeholder="••••••••" />
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button class="submit-button" type="submit" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">Se connecter</span>
          <span *ngIf="isSubmitting" class="loading">
            <span class="spinner"></span>
            <span>Connexion...</span>
          </span>
        </button>
      </form>

      <div class="login-footer">
        Connexion sécurisée • BarakaPay
      </div>
    </div>
  </div>
</div>
